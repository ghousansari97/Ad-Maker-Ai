
workflows:
  android-debug:
    name: AdMaker AI Android Build
    max_build_duration: 30

    environment:
      flutter: stable

    scripts:
      - name: Extract AdMaker AI project
        script: |
          unzip -o AdMaker_AI_MVP_v0.1.zip
          cd AdMaker_AI_MVP_v0.1
          flutter pub get

      - name: Build Android APK
        script: |
          cd AdMaker_AI_MVP_v0.1
          flutter build apk --debug

    artifacts:
      - AdMaker_AI_MVP_v0.1/build/app/outputs/flutter-apk/app-debug.apk
